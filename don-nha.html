<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giữ hay bỏ?</title>
<style>
:root{--bg:#f6f4ef;--ink:#23211e;--mute:#7a756c;--line:#ded9ce;--acc:#2b4a6f;
--keep:#2f7d5b;--keepbg:#e3f2ea;--hold:#b8791a;--holdbg:#fbf0d9;--go:#b8453a;--gobg:#f9e5e2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.screen{height:100%;max-width:460px;margin:0 auto;padding:18px 18px 22px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;min-height:30px;margin-bottom:auto}
.back{border:0;background:none;color:var(--mute);font:inherit;font-size:15px;cursor:pointer;padding:4px 0;visibility:hidden}
.dots{display:flex;gap:6px;margin-left:auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--acc)}
.body{flex:0 1 auto}
.q{font-size:21px;font-weight:650;margin:0 0 18px;line-height:1.3}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;
border-radius:13px;padding:15px 16px;margin-bottom:9px;font:inherit;color:var(--ink);cursor:pointer;transition:transform .1s}
.opt small{display:block;color:var(--mute);font-size:13.5px;margin-top:2px}
.opt:active{transform:scale(.985);border-color:var(--acc)}
.foot{margin-top:auto}
.res{border-radius:14px;padding:20px;border:1.5px solid}
.res.keep{background:var(--keepbg);border-color:var(--keep)}
.res.hold{background:var(--holdbg);border-color:var(--hold)}
.res.go{background:var(--gobg);border-color:var(--go)}
.res h2{margin:0 0 8px;font-size:23px}
.res.keep h2{color:var(--keep)}.res.hold h2{color:var(--hold)}.res.go h2{color:var(--go)}
.res p{margin:0;font-size:16px}
.btn{width:100%;border:0;background:var(--acc);color:#fff;border-radius:13px;
padding:16px;font:inherit;font-size:17px;font-weight:650;cursor:pointer;margin-top:14px}
.fade{animation:f .18s ease-out}
@keyframes f{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="screen">
  <div class="top">
    <button class="back" id="back">&larr; Quay lại</button>
    <div class="dots" id="dots"></div>
  </div>
  <div class="body" id="body"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
var Q=[
 {k:'use',t:'Trong 30 ngày tới có dùng không?',o:[[1,'Chắc chắn dùng',''],[0,'Không rõ / thỉnh thoảng',''],[-1,'Không dùng','']]},
 {k:'val',t:'Món này hữu ích đến đâu?',o:[[1,'Rất hữu ích','Dùng thường xuyên'],[0,'Bình thường','Có cũng được'],[-1,'Không cần','Trùng lặp hoặc vô dụng']]},
 {k:'loc',t:'Đã có chỗ cố định chưa?',o:[[1,'Có chỗ ngay','Cất được liền'],[0,'Chưa có chỗ riêng','Nhưng gom hộp hoặc nhường chỗ được'],[-1,'Không có chỗ','Để đâu cũng vướng']]}
];
var step=0,a=[];
function $(i){return document.getElementById(i)}
function dots(){
  var h='';for(var i=0;i<4;i++)h+='<div class="dot'+(i===step?' on':'')+'"></div>';
  $('dots').innerHTML=h;
}
function render(){
  dots();
  $('back').style.visibility=step>0?'visible':'hidden';
  if(step<3){
    var q=Q[step];
    $('body').className='body fade';
    $('body').innerHTML='<p class="q">'+q.t+'</p>'+q.o.map(function(o,i){
      return '<button class="opt" data-v="'+o[0]+'"><b>'+o[1]+'</b>'+(o[2]?'<small>'+o[2]+'</small>':'')+'</button>';
    }).join('');
    $('foot').innerHTML='';
    document.querySelectorAll('.opt').forEach(function(b){
      b.onclick=function(){a[step]=+b.dataset.v;step++;render()};
    });
    void $('body').offsetWidth;
  }else{
    var s=a[0]+a[1]+a[2],h;
    if(s>=2){
      h='<div class="res keep"><h2>Giữ lại</h2><p>'+(
        a[2]===1?'Cất vào chỗ cố định của nó, xong ngay.':
        a[2]===0?'Chốt luôn một hộp hoặc một góc cho nó rồi mới cất - đừng để nó lang thang.':
        'Đáng giữ nhưng chưa có chỗ: nhường chỗ bằng cách bỏ một món kém hơn, hoặc chốt hộp trước khi cất.'
      )+'</p></div>';
    }else if(s>=0){
      var d=new Date();d.setDate(d.getDate()+30);
      h='<div class="res hold"><h2>Tạm giữ 30 ngày</h2><p>Bỏ vào hộp "Xem xét lại sau 30 ngày", ghi ngày <b>'+
        d.getDate()+'/'+(d.getMonth()+1)+'</b>. Quá hạn mà không đụng tới thì bỏ.</p></div>';
    }else{
      h='<div class="res go"><h2>Bỏ đi ngay</h2><p>Còn tốt thì cho hoặc tặng, tái chế được thì mang đi tái chế, còn lại thì bỏ.</p></div>';
    }
    $('body').className='body fade';
    $('body').innerHTML=h;
    $('foot').innerHTML='<button class="btn" id="next">Món tiếp theo</button>';
    $('next').onclick=function(){step=0;a=[];render()};
  }
}
$('back').onclick=function(){if(step>0){step--;render()}};
render();
</script>
</body>
</html>
